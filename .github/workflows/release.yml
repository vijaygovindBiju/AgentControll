name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Extract Version
        id: vars
        run: |
          VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Release Binaries
        run: |
          cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package Archive
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="agentcontroll-v${VERSION}-${TARGET}.tar.gz"
          BIN_DIR="target/${TARGET}/release"
          
          mkdir -p dist
          # Ensure all required binaries are executable before packaging:
          # agentcontroll (primary), agent-control, ac, agentcontrold
          chmod +x "${BIN_DIR}/agentcontroll" "${BIN_DIR}/agent-control" "${BIN_DIR}/ac" "${BIN_DIR}/agentcontrold"
          tar -czf "dist/${ARCHIVE_NAME}" -C "${BIN_DIR}" agentcontroll agent-control ac agentcontrold
          
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  create-draft-release:
    name: Create Draft GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: AgentControll ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: true
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-npm:
    name: Publish NPM Package (Trusted Publishing)
    needs: [build-release, create-draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm CLI version
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Publish to NPM via OIDC Trusted Publishing
        run: |
          cd packages/agent-control
          npm publish --provenance --access public
