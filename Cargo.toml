[workspace]
resolver = "2"
members = [
    "crates/ac-core",
    "crates/ac-cli",
    "crates/ac-tui",
]

[workspace.package]
version = "1.0.7"
edition = "2021"
authors = ["AgentControll contributors"]
license = "MIT"
description = "Local-first control plane for coding agents (Antigravity, Claude Code, Codex, Devin CLI)"
repository = "https://github.com/vijaygovindBiju/AgentControll"
homepage = "https://github.com/vijaygovindBiju/AgentControll"
readme = "README.md"
keywords = ["coding-agent", "antigravity", "claude-code", "terminal", "tui"]
categories = ["command-line-utilities", "development-tools"]
[workspace.lints.clippy]
all = { level = "allow", priority = -1 }

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# Persistence
rusqlite = { version = "0.32", features = ["bundled", "trace"] }

# Identifiers (ULID)
ulid = { version = "1.1" }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = { version = "1.0" }
anyhow = { version = "1.0" }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI parsing
clap = { version = "4.5", features = ["derive", "cargo", "env"] }

# Unix socket IPC (client side)
tokio-stream = { version = "0.1" }

# Config file
toml = { version = "0.8" }

# Testing
tempfile = { version = "3.10" }

# PTY and process control (Phase 4)
portable-pty = { version = "0.9" }
regex = { version = "1.10" }
libc = { version = "0.2" }

# TUI (Phase 5)
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

# WebSocket and Async Streams (Phase 7)
tokio-tungstenite = "0.24"
futures-util = "0.3"

