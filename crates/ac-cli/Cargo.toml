[package]
name = "ac-cli"
version.workspace = true
edition.workspace = true
description = "Agent Control CLI — user launchers, interactive sessions, and power-user commands"

[lib]
name = "ac_cli"
path = "src/lib.rs"

[[bin]]
name = "ac"
path = "src/bin/ac.rs"

[[bin]]
name = "agy"
path = "src/bin/agy.rs"

[[bin]]
name = "agent-control"
path = "src/bin/agent_control.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
libc = { workspace = true }

# Core types shared with the daemon
ac-core = { path = "../ac-core" }
ac-tui = { path = "../ac-tui" }

[dev-dependencies]
base64 = "0.22.1"
tempfile = { workspace = true }
